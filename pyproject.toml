[project]
name = "sentry-scm"
version = "2.0.0"
description = "A unified interface for source code management providers"
readme = "README.md"
license = "LicenseRef-FSL-1.1-Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Colton Allen", email = "colton.allen@sentry.io" }
]
requires-python = ">=3.13"
dependencies = [
    # Git grants are signed with Ed25519 keys, which scm.git.grant parses and PyJWT's EdDSA needs.
    "cryptography>=48.0.1",
    "msgspec>=0.19.0",
    "pyjwt>=2.9.0",
    "requests>=2.32.4",
    # The git relay streams responses through urllib3 directly. Before 2.8.0, a server could make its chunked
    # reader buffer without limit (GHSA-vxq7-64xx-v4gw).
    "urllib3>=2.8.0",
]

[build-system]
requires = ["uv_build<=0.9.28"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scm"
module-root = "src"

[[tool.uv.index]]
# Socket Firewall's PyPI proxy, also the MDM default on Sentry machines.
# Pinning it here keeps uv.lock identical with or without that config.
name = "sentry-sfw"
url = "https://sfw.security.sentry.io/pypi/simple"
default = true

[tool.mypy]
python_version = "3.13"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "B", # flake8-bugbear
  "LOG", # flake8-logging
  "I", # isort
  "T20", # flake8-print (replaces S002)
  "UP", # pyupgrade
]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "prek>=0.3.6",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
    "types-requests>=2.33.0.20260408",
]
