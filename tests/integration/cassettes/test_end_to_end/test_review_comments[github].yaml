      100, after: $cursor) {\n                pageInfo { hasNextPage endCursor }\n                nodes
      {\n                    id\n                    comments(first: 100) {\n                        pageInfo
      { hasNextPage endCursor }\n                        nodes { id }\n                    }\n                }\n            }\n        }\n    }\n}\n",
