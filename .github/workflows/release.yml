name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type (auto picks it from the PR titles since the last release)
        required: true
        type: choice
        default: auto
        options:
          - auto
          - minor
          - patch
          - major
      force:
        description: Force release (bypass blockers)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: 'Release a new version'
    steps:
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        with:
          app-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      # scripts/bump-version.sh runs uv to write the version craft picks.
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      # Craft resolves "auto" and the bump types against the last release tag.
      - name: Prepare release
        uses: getsentry/craft@924b450ede4af30e30de4821a4b357d676c8df92 # 3.0.0
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          version: ${{ inputs.bump }}
          force: ${{ inputs.force }}
